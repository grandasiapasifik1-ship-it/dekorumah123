<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dekor123</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <!-- CSS Custom -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="img/logo.png" alt="Dekor123 Logo" width="120">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navmenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Layanan</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Kontak</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="py-5 text-center bg-primary text-white">
    <div class="container">
      <h1 class="display-4">Dekor123</h1>
      <p class="lead fst-italic">Solusi terbaik untuk bangunan rumah impian Anda</p>
    </div>
  </header>

  <!-- Partner Logos -->
  <section class="py-5 bg-light">
    <div class="container text-center">
      <h2 class="mb-4">Partner & Material</h2>
      <div class="d-flex justify-content-center flex-wrap gap-3">
        <a class="btn btn-raised" href="#">
          <img src="img/Alderon-Logo.jpg" alt="Alderon Logo" width="100" height="40">
        </a>
        <a class="btn btn-raised" href="#">
          <img src="img/Taco-Logo.png" alt="Taco Logo" width="100" height="40">
        </a>
        <a class="btn btn-raised" href="#">
          <img src="img/Dulux-Logo.png" alt="Dulux Logo" width="100" height="40">
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer bg-dark text-white mt-5">
    <div class="container py-4 text-center">
      <p class="mb-0">&copy; 2024 Dekor123. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
